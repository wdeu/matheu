# Deploy to IONOS via FTP — DISABLED as an automatic push trigger.
# FTP_PATH points at a different directory than the one matheu.eu actually
# serves (~/matheu via SSH, see raycast-scripts/ionos-sync.sh). CI kept
# reporting "success" while uploading to a location nobody looks at, which
# masked real deploys for months. Real deploys go through
# `raycast-scripts/ionos-sync.sh matheu push` (after `npm run build`) until
# FTP_PATH is corrected — then this trigger can go back to `push: main`.
# Needs GitHub Secrets: FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_PATH

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy via SFTP
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set ssl:verify-certificate no;
            open sftp://${{ secrets.FTP_HOST }};
            user ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }};
            cd ${{ secrets.FTP_PATH }};
            mirror -R --delete --verbose --exclude .git/ dist/ ./;
            bye
          "
